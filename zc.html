<style>

:root {
  --background: oklch(0.975 0.006 90);
  --foreground: oklch(0.24 0.03 255);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.24 0.03 255);
  --primary: oklch(0.38 0.075 255);
  --primary-foreground: oklch(0.98 0 0);
  --secondary: oklch(0.93 0.012 90);
  --muted-foreground: oklch(0.68 0.11 75);
  --accent: oklch(0.68 0.11 75);
  --accent-foreground: oklch(0.22 0.025 255);
  --brand-deep: oklch(0.24 0.05 258);
  --border: oklch(0.929 0.013 255.508);
  --radius: 0.25rem;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  border-color: var(--border);
}

body {
  background: var(--background);
  color: var(--foreground);
  font-family: "Source Sans 3", sans-serif;
  line-height: 1.6;
}

img {
  display: block;
  max-width: 100%;
}

a {
  text-decoration: none;
  color: inherit;
}

.font-display {
  font-family: "Libre Baskerville", serif;
}

.container {
  max-width: 80rem;
  margin: 0 auto;
  padding: 0 1.5rem;
}

section {
  padding: 6rem 0;
}

.eyebrow {
  font-size: .8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .15em;
  color: var(--primary);
}

h1,
h2 {
  font-family: "Libre Baskerville", serif;
  font-weight: 700;
  line-height: 1.1;
}

h2 {
  font-size: clamp(1.8rem, 3.5vw, 2.5rem);
  margin-top: .5rem;
}

/* Header */

header {
  position: absolute;
  inset: 0 0 auto;
  z-index: 20;
}

header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 1.25rem;
  padding-bottom: 1.25rem;
}

.brand {
  font-family: "Libre Baskerville", serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--primary-foreground);
}

.brand span {
  color: var(--accent);
}

nav {
  display: flex;
  gap: 2rem;
  font-size: .9rem;
  color: color-mix(
    in oklab,
    var(--primary-foreground) 80%,
    transparent
  );
}

nav a:hover {
  color: var(--primary-foreground);
}

nav a {
  display: flex;
  align-items: center;
  gap: .5rem;
  background: var(--accent);
  color: var(--accent-foreground);
  padding: .5rem 1rem;
  border-radius: var(--radius);
  font-size: .9rem;
  font-weight: 600;
  transition: filter .2s;
}

nav a:hover {
  filter: brightness(1.1);
}

/* Hero */

.hero {
  position: relative;
  display: flex;
  align-items: center;
  min-height: 92vh;
  overflow: hidden;
  background: var(--brand-deep);
}

.hero img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: kenburns 30s ease-in-out infinite alternate;
}

@keyframes kenburns {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.07);
  }
}

.hero .overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      100deg,
      color-mix(
        in oklab,
        var(--brand-deep) 94%,
        transparent
      ) 25%,
      color-mix(
        in oklab,
        var(--brand-deep) 45%,
        transparent
      )
    );
}

.hero .container {
  position: relative;
  z-index: 10;
  padding-top: 8rem;
  padding-bottom: 8rem;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  border: 1px solid
    color-mix(
      in oklab,
      var(--primary-foreground) 20%,
      transparent
    );
  border-radius: 9999px;
  padding: .25rem .75rem;
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .15em;
  color: color-mix(
    in oklab,
    var(--primary-foreground) 80%,
    transparent
  );
  margin-bottom: 1.25rem;
}

.badge svg {
  color: var(--accent);
}

.hero h1 {
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  color: var(--primary-foreground);
}

.hero h1 span {
  color: var(--accent);
}

.hero p.lead {
  margin-top: 1.5rem;
  max-width: 36rem;
  font-size: 1.15rem;
  color: color-mix(
    in oklab,
    var(--primary-foreground) 80%,
    transparent
  );
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: 1rem 1.25rem;
  border-radius: var(--radius);
  font-weight: 600;
  transition: transform .2s, filter .2s;
  border: 0;
  cursor: pointer;
  font-size: 1rem;
  font-family: inherit;
}

.btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

.hero .btn {
  margin-top: 2rem;
}

/* Lead form */

.lead-form {
  max-width: 28rem;
  margin-top: 1.5rem;
}

.field-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  overflow: hidden;
  transition: border-color .25s, box-shadow .25s;
  box-shadow:
    0 4px 14px -8px
    color-mix(
      in oklab,
      var(--brand-deep) 45%,
      transparent
    );
}

.field-card:hover,
.field-card:focus-within {
  border-color: var(--primary);
}

.field-card input {
  display: block;
  width: 100%;
  background: transparent;
  padding: .875rem 1rem;
  color: var(--foreground);
  outline: none;
  border: 0;
  font-size: 1rem;
  font-family: inherit;
}

.field-card input + input {
  border-top: 1px solid var(--border);
}

.field-card input::placeholder {
  color: var(--muted-foreground);
}

.lead-form .btn {
  margin-top: .75rem;
  width: 100%;
  justify-content: center;
}

@media (min-width: 640px) {
  .lead-form .btn {
    width: auto;
  }
}

.on-dark {
  background: color-mix(
    in oklab,
    var(--primary-foreground) 6%,
    transparent
  );
  border-color: color-mix(
    in oklab,
    var(--primary-foreground) 25%,
    transparent
  );
}

.on-dark .field-card input {
  color: var(--primary-foreground);
}

.on-dark .field-card input + input {
  border-top-color: color-mix(
    in oklab,
    var(--primary-foreground) 20%,
    transparent
  );
}

/* Services */

.grid3 {
  display: grid;
  gap: 2rem;
  margin-top: 3rem;
}

@media (min-width: 768px) {
  .grid3 {
    grid-template-columns: repeat(3, 1fr);
  }
}

.card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  overflow: hidden;
  transition: box-shadow .35s;
}

.card:hover {
  box-shadow:
    0 14px 30px -14px
    color-mix(
      in oklab,
      var(--brand-deep) 40%,
      transparent
    );
}

.card .imgwrap {
  aspect-ratio: 4 / 3;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .6s;
}

.card:hover img {
  transform: scale(1.03);
}

.card .body {
  padding: 1.5rem;
}

.card .body svg {
  color: var(--primary);
}

.card h3 {
  font-family: "Libre Baskerville", serif;
  font-size: 1.25rem;
  font-weight: 600;
  margin-top: .75rem;
  color: var(--card-foreground);
}

.card .body p {
  margin-top: .5rem;
  color: var(--muted-foreground);
}

/* About */

.about {
  background: var(--secondary);
}

.about .cols {
  display: grid;
  gap: 3rem;
  align-items: center;
}

@media (min-width: 768px) {
  .about .cols {
    grid-template-columns: 1fr 1fr;
  }
}

.about .imgwrap {
  border-radius: var(--radius);
  overflow: hidden;
  transition: box-shadow .35s;
}

.about .imgwrap:hover {
  box-shadow:
    0 14px 30px -14px
    color-mix(
      in oklab,
      var(--brand-deep) 40%,
      transparent
    );
}

.about .imgwrap img {
  width: 100%;
  object-fit: cover;
  transition: transform .6s;
}

.about .imgwrap:hover img {
  transform: scale(1.03);
}

.about p.text {
  margin-top: 1.25rem;
  font-size: 1.1rem;
  color: var(--muted-foreground);
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-top: 2rem;
  text-align: center;
}
